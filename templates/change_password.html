{% extends "base.html" %}
{% block title %}Wachtwoord wijzigen{% endblock %}
{% block content %}

<h2>Wachtwoord wijzigen</h2>

<form method="POST" class="mt-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="current_password" class="form-label">Huidig wachtwoord</label>
        <input type="password" class="form-control" id="current_password" name="current_password"
               required autocomplete="current-password">
    </div>
    <div class="mb-3">
        <label for="new_password" class="form-label">Nieuw wachtwoord</label>
        <input type="password" class="form-control" id="new_password" name="new_password"
               required minlength="8" autocomplete="new-password">
        <div class="form-text">Minimaal 8 tekens.</div>
    </div>
    <div class="mb-3">
        <label for="confirm_password" class="form-label">Bevestig nieuw wachtwoord</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
               required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary">Wijzig wachtwoord</button>
</form>

{% endblock %}
